<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials | Sultan Academy</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="personal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header id="main-header"></header>

    <main class="section" style="padding-top: 90px;">
        <div class="section-header">
            <h2>Student & Educator Testimonials</h2>
            <p>Real voices from our global learning community.</p>
        </div>

        <div class="testimonials-grid" id="testimonialsGrid">
            <p class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading testimonials...</p>
        </div>

        <div class="testimonial-form-box">
            <h3><i class="fas fa-comment-dots" style="color: #38bdf8;"></i> Share Your Experience</h3>
            <p>Loved a session or our resources? Leave a testimonial below.</p>
            <form id="testimonialForm" class="testi-form">
                <div class="testi-row">
                    <input type="text" id="testiName" maxlength="20" required placeholder="Your Name (max 20 chars)">
                    <input type="text" id="testiRole" maxlength="25" required placeholder="Your Role (e.g. Learner)">
                    <select id="testiRating">
                        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                        <option value="3">⭐⭐⭐ (3/5)</option>
                    </select>
                </div>
                <textarea id="testiMsg" rows="3" maxlength="180" required placeholder="Write your feedback (max 180 chars)..."></textarea>
                <button type="submit" id="testiSubmitBtn" class="submit-profile-btn">
                    <i class="fas fa-paper-plane"></i> Send Testimonial
                </button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Sultan Alizada • <a href="privacy.html" style="color: #38bdf8;">Privacy & Legal Notice</a></p>
    </footer>

    <a href="YOUR_WISE_LINK_HERE" class="metallic-support-btn" target="_blank" rel="noopener"><i class="fas fa-hand-holding-heart"></i> Support Our Work</a>

    <script src="js/navbar.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script type="module" src="js/wizard.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const supabase = createClient('https://ezccynahgubalainoqkf.supabase.co', 'sb_publishable_ipRtiX4xI1SYlMxU8YAWQw_D8txWLKX');

        async function loadTestimonials() {
            const grid = document.getElementById('testimonialsGrid');
            const { data } = await supabase.from('testimonials').select('*').eq('status', 'approved').order('id', { ascending: false });
            if (!data || data.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; color: #64748b; font-size: 14px;">Be the first to share your experience below!</p>`;
                return;
            }
            grid.innerHTML = data.map(t => `
                <div class="testi-card">
                    <div class="testi-quote-icon"><i class="fas fa-quote-left"></i></div>
                    <div class="testi-stars">${"⭐".repeat(t.rating)}</div>
                    <p class="testi-body">"${t.message}"</p>
                    <div class="testi-author">
                        <div class="testi-avatar">${t.author_name.charAt(0).toUpperCase()}</div>
                        <div><strong>${t.author_name}</strong><span>${t.author_role}</span></div>
                    </div>
                </div>`).join('');
        }

        document.getElementById('testimonialForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('testiSubmitBtn');
            btn.disabled = true;
            const { error } = await supabase.from('testimonials').insert([{
                author_name: document.getElementById('testiName').value.trim(),
                author_role: document.getElementById('testiRole').value.trim(),
                rating: parseInt(document.getElementById('testiRating').value),
                message: document.getElementById('testiMsg').value.trim(),
                status: 'pending'
            }]);
            if (!error) { alert("Thank you! Your testimonial has been sent."); e.target.reset(); }
            else { alert("Error sending testimonial."); }
            btn.disabled = false;
        });

        loadTestimonials();
    </script>
</body>
</html>
