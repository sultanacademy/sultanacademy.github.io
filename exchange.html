<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language & Cultural Exchange | Sultan Academy</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="personal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header id="main-header"></header>

    <main class="section" style="padding-top: 90px;">
        <div class="section-header">
            <h2>🌍 Language & Cultural Exchange</h2>
            <p>Practice speaking with native speakers around the world and share your culture for free.</p>
        </div>

        <div style="margin-bottom: 30px;">
            <button type="button" id="openExModalBtn" class="inline-blue-btn" style="padding: 11px 24px; font-size: 14px; border:none; background: #38bdf8; color:#0f172a !important;">
                <i class="fas fa-plus-circle"></i> Post Language Exchange Card
            </button>
        </div>

        <div class="tutors-grid" id="exchangeGrid">
            <p class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading Language Exchange Partners...</p>
        </div>
    </main>

    <div id="exModal" class="auth-modal-overlay hidden">
        <div class="dashboard-modal-card" style="max-width: 520px; text-align: left;">
            <button class="auth-close-btn" id="closeExModal" type="button">&times;</button>
            <h3 style="color:#fff; margin-bottom:14px;"><i class="fas fa-globe" style="color:#38bdf8;"></i> Post Cultural Exchange</h3>
            <form id="exForm" class="educator-form">
                <div class="form-row">
                    <div class="form-group"><label>Your Name (max 20) *</label><input type="text" id="exName" maxlength="20" required></div>
                    <div class="form-group"><label>Private Email (Admin Only) *</label><input type="email" id="exEmail" maxlength="50" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Native / Offered Language *</label><input type="text" id="exOffer" maxlength="25" required placeholder="e.g. Azerbaijani / Turkish"></div>
                    <div class="form-group"><label>Target Language *</label><input type="text" id="exWant" maxlength="25" required placeholder="e.g. German B2"></div>
                </div>
                <div class="form-group"><label>Short Intro (max 160) *</label><textarea id="exDesc" rows="2" maxlength="160" required style="background:#1e293b; border:1px solid #334155; color:white; padding:10px; border-radius:10px; font-size:13px;"></textarea></div>
                <div class="form-group"><label>Sultan Academy Discord Room Link *</label><input type="url" id="exDiscord" required placeholder="https://discord.com/channels/..."></div>
                <button type="submit" id="exSubmitBtn" class="submit-profile-btn">Publish Exchange Card</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 Sultan Alizada • <a href="privacy.html" style="color: #38bdf8;">Privacy & Legal Notice</a></p>
    </footer>

    <a href="YOUR_WISE_LINK_HERE" class="metallic-support-btn" target="_blank" rel="noopener"><i class="fas fa-hand-holding-heart"></i> Support Our Work</a>

    <script src="js/navbar.js"></script>
    <script src="js/cookie-consent.js"></script>
    <script type="module" src="js/wizard.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const supabase = createClient('https://ezccynahgubalainoqkf.supabase.co', 'sb_publishable_ipRtiX4xI1SYlMxU8YAWQw_D8txWLKX');

        async function loadExchange() {
            const grid = document.getElementById("exchangeGrid");
            const { data } = await supabase.from("skill_swaps").select("id, author_name, offer_skill, want_skill, description, discord_link").eq("status", "approved").eq("swap_type", "Language & Cultural Exchange").order("id", { ascending: false });
            if (!data || data.length === 0) {
                grid.innerHTML = `<p style="grid-column:1/-1; color:#64748b;">No language exchange cards yet. Post the first one above!</p>`;
                return;
            }
            grid.innerHTML = data.map(s => `
                <div class="tutor-card">
                    <div class="tutor-tags" style="margin-bottom:10px;">
                        <span style="color:#38bdf8; border-color:#38bdf8;">Cultural Exchange</span>
                        <span>${s.author_name}</span>
                    </div>
                    <h4 style="color:#0f172a; font-size:15px; margin-bottom:8px;">
                        <span style="color:#10b981;">Speaks:</span> ${s.offer_skill}<br>
                        <span style="color:#f59e0b;">Learning:</span> ${s.want_skill}
                    </h4>
                    <p class="tutor-bio">${s.description}</p>
                       <div class="tutor-footer">
                        <a href="chat.html?to=${encodeURIComponent(s.author_name)}&ctx=${encodeURIComponent('Language & Cultural Exchange')}" class="cal-booking-btn" style="background:#10b981; color:#fff !important; width:100%;">
                            <i class="fas fa-comment-dots"></i> Send Message Request
                        </a>
                        <button class="unlock-tutor-btn ex-unlock-btn" data-target="${s.discord_link}">
                            <i class="fab fa-discord"></i> Discord Link (Watch AD)
                        </button>
                    </div>
                </div>`).join("");

            document.querySelectorAll(".ex-unlock-btn").forEach(btn => {
                btn.addEventListener("click", function() {
                    const url = this.dataset.target;
                    if (this.dataset.unlocked === "true") return window.open(url, "_blank");
                    const ad = window.open("https://www.profitableratecpmnetwork.com/fspm49jkm?key=88e5821febc3aed060a93ce3587926fc", "_blank");
                    if (!ad || ad.closed) return alert("⚠️ Pop-up blocked! Please allow pop-ups.");
                    this.style.pointerEvents = "none";
                    let t = 10;
                    this.innerText = `Unlocking... ${t}s`;
                    const iv = setInterval(() => {
                        t--;
                        if (t > 0) this.innerText = `Unlocking... ${t}s`;
                        else { clearInterval(iv); this.dataset.unlocked = "true"; this.innerText = "Ready! Tap to Open"; this.style.background = "#10b981"; this.style.pointerEvents = "auto"; window.open(url, "_blank"); }
                    }, 1000);
                });
            });
        }

        const exModal = document.getElementById("exModal");
        document.getElementById("openExModalBtn").addEventListener("click", () => { exModal.classList.remove("hidden"); document.body.classList.add("modal-open"); });
        document.getElementById("closeExModal").addEventListener("click", () => { exModal.classList.add("hidden"); document.body.classList.remove("modal-open"); });

        document.getElementById("exForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("exSubmitBtn");
            btn.disabled = true;
            const { error } = await supabase.from("skill_swaps").insert([{
                author_name: document.getElementById("exName").value.trim(),
                email: document.getElementById("exEmail").value.trim(),
                swap_type: "Language & Cultural Exchange",
                offer_skill: document.getElementById("exOffer").value.trim(),
                want_skill: document.getElementById("exWant").value.trim(),
                description: document.getElementById("exDesc").value.trim(),
                discord_link: document.getElementById("exDiscord").value.trim(),
                status: "pending"
            }]);
            if (!error) { alert("🎉 Exchange card submitted!"); e.target.reset(); exModal.classList.add("hidden"); document.body.classList.remove("modal-open"); }
            else { alert("Error submitting."); }
            btn.disabled = false;
        });

        loadExchange();
    </script>
</body>
</html>
