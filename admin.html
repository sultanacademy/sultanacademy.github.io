<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan Academy - Secure Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0a0f1d; color: #f8fafc; padding: 40px 20px; }
        .admin-box { max-width: 950px; margin: 0 auto; background: #1e293b; padding: 35px; border-radius: 24px; border: 1px solid #334155; }
        h1 { margin-bottom: 25px; color: #38bdf8; font-size: 24px; }
        .auth-gate { text-align: center; padding: 40px 20px; background: #0f172a; border-radius: 16px; border: 1px solid #334155; }
        input { padding: 12px 16px; border-radius: 10px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 14px; margin-bottom: 12px; width: 100%; max-width: 320px; }
        .btn { background: #38bdf8; color: #0f172a; font-weight: 700; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; font-size: 13px; }
        th { color: #94a3b8; }
        .btn-approve { background: #10b981; color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .avatar-preview { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h1><i class="fas fa-user-shield"></i> Sultan Academy Admin Portal</h1>

<!-- TƏHLÜKƏSİZ ŞİFRƏLİ GİRİŞ (LİMİTSİZ VƏ DƏRHAL) -->
        <div id="authGate" class="auth-gate">
            <i class="fas fa-lock" style="font-size: 40px; color: #38bdf8; margin-bottom: 15px;"></i>
            <h3 style="margin-bottom: 10px;">Admin Authentication</h3>
            <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Enter your admin password to access the control center.</p>

            <div>
                <input type="email" id="adminEmailInput" value="sultanacademyinfo@gmail.com" readonly style="opacity: 0.8;"><br>
                <input type="password" id="adminPasswordInput" placeholder="Enter your secret password"><br>
                <button class="btn" id="loginPasswordBtn">Login to Admin Portal</button>
            </div>
        </div>

        <!-- ƏSAS İDARƏETMƏ PANELİ (YALNIZ SƏN GİRƏNDƏ AÇILIR) -->
        <div id="dashboardArea" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #10b981; font-size: 18px;"><i class="fas fa-clock"></i> Pending Educator Applications</h2>
                <button class="btn" id="logoutBtn" style="background: #ef4444; color: white; padding: 8px 16px;">Logout</button>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Photo</th>
                            <th>Name</th>
                            <th>Language</th>
                            <th>Subject</th>
                            <th>Price</th>
                            <th>Discord Room</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tutorsTableBody">
                        <tr><td colspan="7">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const supabase = createClient('https://ezccynahgubalainoqkf.supabase.co', 'sb_publishable_ipRtiX4xI1SYlMxU8YAWQw_D8txWLKX');

        // Yalnız bu emailin daxil olmasına icazə verilir:
        const ADMIN_EMAIL = "sultanacademyinfo@gmail.com";

        const authGate = document.getElementById("authGate");
        const dashboardArea = document.getElementById("dashboardArea");

        // 1. Kodu Gmaile göndər
        document.getElementById("sendOtpBtn").addEventListener("click", async () => {
            const email = document.getElementById("adminEmailInput").value.trim();
            if (email !== ADMIN_EMAIL) {
                return alert("Access Denied! You are not the authorized administrator.");
            }

// Yeni sətir (Birbaşa Redirect URL-ə yönləndirir):
const { error } = await supabase.auth.signInWithOtp({ 
    email: ADMIN_EMAIL,
    options: {
        emailRedirectTo: 'https://sultanalizada.github.io/admin.html'
    }
});            if (!error) {
                alert("6-digit code has been sent to your Gmail!");
                document.getElementById("emailStep").style.display = "none";
                document.getElementById("otpStep").style.display = "block";
            } else {
                alert("Error sending code: " + error.message);
            }
        });

       // Şifrə ilə 1 saniyədə limitsiz giriş
        document.getElementById("loginPasswordBtn").addEventListener("click", async () => {
            const email = document.getElementById("adminEmailInput").value.trim();
            const password = document.getElementById("adminPasswordInput").value.trim();

            if (!password) return alert("Please enter your password!");

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (!error && data.session) {
                authGate.style.display = "none";
                dashboardArea.style.display = "block";
                loadTutors();
            } else {
                alert("Access Denied! Wrong password or unauthorized user.");
            }
        });

        // Müraciətləri yüklə
        async function loadTutors() {
            const { data: tutors } = await supabase.from('tutors').select('*').order('id', { ascending: false });
            const tbody = document.getElementById("tutorsTableBody");
            tbody.innerHTML = "";

            if (!tutors || tutors.length === 0) {
                tbody.innerHTML = "<tr><td colspan='7'>No applications found.</td></tr>";
                return;
            }

            tutors.forEach(t => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><img src="${t.avatar_url}" class="avatar-preview" onerror="this.src='your-photo.jpg'"></td>
                    <td><strong>${t.name}</strong></td>
                    <td>${t.language}</td>
                    <td>${t.subject}</td>
                    <td>${t.price}</td>
                    <td><a href="${t.discord_channel}" target="_blank" style="color:#38bdf8;">Discord Link</a></td>
                    <td>
                        ${t.status === 'pending' 
                            ? `<button class="btn-approve" data-id="${t.id}">Approve</button>` 
                            : '<span style="color:#10b981; font-weight:bold;">Active</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.querySelectorAll(".btn-approve").forEach(b => {
                b.addEventListener("click", async (e) => {
                    const id = e.target.getAttribute("data-id");
                    await supabase.from('tutors').update({ status: 'approved' }).eq('id', id);
                    alert("Educator approved and published to the website!");
                    loadTutors();
                });
            });
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });
    </script>
</body>
</html>
